; ##############################################################################
;
;   SoraVR settings  -  VR for Trails in the Sky 1st Chapter
;
;   This file sits next to sora_1st.exe. SoraVR creates it with these defaults
;   the first time the game starts. Delete it to get a fresh copy.
;
;   How to read it:
;     - Every setting has its explanation in the lines ABOVE it.
;     - 1 = on, 0 = off. Distances and sizes are in metres.
;     - Lines starting with ; are comments and are ignored.
;     - "Saved" = the hotkey changes this value and writes it back here.
;       Other hotkeys (on/off toggles) only last until the game is closed.
;
; ##############################################################################



; ==============================================================================
;   [Stereo]  -  3D rendering, and the world behind menus
; ==============================================================================
[Stereo]

; Stereo 3D on / off.
; Hotkey: F10
Enabled=1

; Render both eyes every frame (recommended).
; 0 = older alternate-eye mode: faster, but less comfortable.
; Hotkey: F9
DualRender=1

; Swap left and right eye, if the 3D ever looks inside-out.
; Hotkey: F6 (saved)
SwapEyes=0


; ---- Menus -------------------------------------------------------------------

; Show the live 3D world behind menus, instead of the game's flat screenshot.
; Hotkey: Ctrl+F10
LiveWorldInMenus=1

; Blur and darken that world while a menu is open
; (fades in and out with the game's own menu animation).
MenuBlur=1

; How soft the blur is. Higher = softer.
MenuBlurRadius=1.5

; Brightness of the world behind menus. 1.0 = not darkened.
MenuDim=0.6

; Screens the game shows as a flat picture (title screen, loading screens)
; appear as a big screen in the room, behind the menu panel.
MenuBackdropScreen=1

; Distance (metres) and size of that big screen.
MenuBackdropDistance=4.0
MenuBackdropScale=1.4



; ==============================================================================
;   [VR]  -  Head tracking, world size and field of view
; ==============================================================================
[VR]

; Head tracking when the game starts.
; F4 turns it off / on for the current session.
HeadTrackingAtStart=1

; Recenter automatically this many seconds after the headset starts tracking.
; 0 = off. You can always recenter by hand with F1.
AutoRecenterSeconds=3

; How big the world feels. Bigger value = the world feels smaller
; (it scales your eye distance and head movement).
; Hotkeys: F7 smaller / F8 bigger (saved)
WorldScale=1.0

; Keep the horizon level by ignoring the game camera's own tilt.
; Hotkey: F5
LevelHorizon=0


; ---- Field of view -----------------------------------------------------------

; Vertical field of view the game renders with, in degrees.
; Wider stops objects popping in and out at the edges of the headset view.
; Hotkeys: F2 narrower / F3 wider (saved)
GameFov=90

; Lock the field of view, so camera zooms (title cards, cutscenes) don't change it.
; Hotkey: F12 (for the session; this line decides what it is at start)
FovLock=1

; Find the game's field-of-view setting automatically when the game starts.
; Ctrl+F12 searches by hand.
AutoFov=1

; Keep the toon outlines at their normal thickness when the field of view is widened.
OutlineFix=1



; ==============================================================================
;   [HUD]  -  The game's interface on a floating panel
; ==============================================================================
[HUD]

; Show menus, dialogue, map etc. on a floating panel.
; Hotkey: Insert
Enabled=1

; 0 = the panel stays in the room, in front of where you recentered.
; 1 = the panel follows your head.
; Hotkey: Delete (saved)
HeadLocked=0

; Panel distance in metres.
; Hotkeys: PageUp nearer / PageDown farther (saved)
Distance=1.6

; Panel width in metres.
; Hotkeys: Home bigger / End smaller (saved)
Width=1.6

; Show the mouse cursor on the panel.
Cursor=1

; Point a VR controller at the panel to move the cursor.
; Trigger = left click, grip = right click, hold and move = drag.
ControllerPointer=1

; Hide the black bars at the top and bottom of the screen during cutscenes.
HideLetterbox=1

; Each eye gets its own panel picture (needed for 3D models in menus).
PanelPerEye=1


; ---- 3D models in menus (equipment, costumes) --------------------------------

; Give the models in menus real depth.
MenuModelStereo=1

; How strong that depth is.
; Hotkeys: Ctrl+F5 less / Ctrl+F6 more (saved)
MenuModelSeparation=0.14

; Which distance sits on the panel. Smaller = the model appears further back.
; Hotkeys: Ctrl+F7 further back / Ctrl+F8 closer (saved)
MenuModelConvergence=4.0



; ==============================================================================
;   [Controllers]  -  VR controllers: orbs and physics
; ==============================================================================
[Controllers]

; Show each controller as a small glowing orb.
Show=1

; Orb diameter in metres.
OrbSize=0.055

; Fade the orb out while the controller is held still, and back in when it moves.
FadeWhenStill=1

; Seconds of stillness before the orb fades, and how long the fade takes.
StillSeconds=1.5
FadeSeconds=1.0

; How far (metres) the controller must move to count as moving
; (so a trembling hand doesn't keep the orb visible).
MoveMargin=0.015


; ---- Physics: hair, cloth, ribbons and accessories move out of the way -------

; Controllers push hair, cloth and accessories aside.
Physics=1

; Extra size of the touch sphere, on top of the orb's radius (metres).
; Hotkeys: Ctrl+PageUp bigger / Ctrl+PageDown smaller (saved)
; Ctrl+Insert shows the touch sphere as an orange circle.
PhysicsExtraRadius=0.010

; Moves the touch sphere forward (+) or back (-) along the controller (metres).
; Hotkeys: Ctrl+Home forward / Ctrl+End back (saved)
PhysicsOffset=0.0



; ==============================================================================
;   [Keys]  -  Change the hotkeys here
; ==============================================================================
;   Allowed: F1 ... F24, a letter or digit (A, 7), Insert, Delete, Home, End,
;   PageUp, PageDown, Pause, ScrollLock, Backspace, Tab, Space,
;   or a Windows key code in hex (0x6B = numpad +).
;   The Ctrl+ combinations always use the keys shown above.
[Keys]

Recenter=F1
FovDown=F2
FovUp=F3
HeadTracking=F4
LevelHorizon=F5
SwapEyes=F6
WorldScaleDown=F7
WorldScaleUp=F8
DualRender=F9
Stereo3D=F10
FovLock=F12

Panel=Insert
PanelFollowHead=Delete
PanelNearer=PageUp
PanelFarther=PageDown
PanelBigger=Home
PanelSmaller=End

; Optional: an extra key (without Ctrl) for the live world behind menus.
;LiveWorldInMenus=



; [FovPaths] below (if present) is written by SoraVR itself: where it found the
; game's field-of-view setting. Delete that section if the field of view stops working.
