; =====================================================================================
;  SoraVR - VR for Trails in the Sky 1st Chapter
;  Settings file. It sits next to sora_1st.exe and is created with these defaults the
;  first time the game starts with SoraVR. Delete it to get a fresh copy.
;
;  1 = on, 0 = off. Distances are in metres. Lines starting with ; are comments.
;  Some values are also changed and saved by hotkeys while you play (noted per line).
; =====================================================================================

[Stereo]
; Stereo 3D on/off. Hotkey: F10
Enabled=1
; Render both eyes every frame (recommended). 0 = older alternate-eye mode. Hotkey: F9
DualRender=1
; Swap left and right eye if the 3D ever looks inside-out. Hotkey: F6
SwapEyes=0

; --- Menus ---
; Draw the live 3D world behind menus instead of the game's flat screenshot. Hotkey: Ctrl+F10
LiveWorldInMenus=1
; Blur and darken that world while a menu is open (follows the game's own menu fade)
MenuBlur=1
; Blur softness (higher = softer)
MenuBlurRadius=1.5
; Brightness of the blurred world (1.0 = no darkening)
MenuDim=0.6
; Screens the game shows as a flat picture (title screen, loading) appear as a big
; screen behind the menu panel: on/off, distance and size
MenuBackdropScreen=1
MenuBackdropDistance=4.0
MenuBackdropScale=1.4

; --- Advanced / experimental (leave as is) ---
; Eye distance used only when the headset is not tracking (monitor testing). Hotkeys: F7/F8
;Separation=0.064
; 0 = both eyes, 1 = left eye only, 2 = right eye only (testing). Hotkey: F11
;Mode=0
; Try to draw the title screen live (didn't help in testing)
;LiveTitleScreen=0
; Head-track every camera, including menu model cameras (makes menu models worse)
;StereoAllCameras=0
; Old menu workaround: freeze the menu picture in the room (shows a mirrored copy behind you)
;HoldSceneInMenus=0
; Old experiment: rewind the game clock between eyes (doesn't work with this game)
;PairedFrames=0

[VR]
; Head tracking is always on when the game starts (F4 turns it off for the session)
HeadTrackingAtStart=1
; Recenter automatically this many seconds after the headset starts tracking (0 = off).
; Recenter by hand any time with F1.
AutoRecenterSeconds=3
; Game units per real metre: scales your eye distance and head movement. Bigger = the
; world feels smaller. Hotkeys: F7 / F8 (saved)
WorldScale=1.0
; Keep the horizon level by removing the game camera's own tilt. Hotkey: F5
LevelHorizon=0

; --- Field of view ---
; Vertical field of view the game renders with, in degrees. A wide view stops objects
; popping in at the edges of the headset. Hotkeys: F2 / F3 (saved)
GameFov=90
; Lock the field of view so camera zooms (title cards, cutscenes) don't change it. Hotkey: F12
FovLock=1
; Find the game's field-of-view setting automatically (Ctrl+F12 searches by hand)
AutoFov=1
; Keep toon outlines the same thickness when the field of view is widened
OutlineFix=1
; Extra widening factor, only used when the field of view isn't found/locked (F2/F3)
;FovScale=1.0

[HUD]
; The game's interface (menus, dialogue, map...) as a floating panel. Hotkey: Insert
Enabled=1
; 0 = panel stays in the room in front of where you recentered, 1 = panel follows your head.
; Hotkey: Delete
HeadLocked=0
; Panel distance and width in metres. Hotkeys: PgUp / PgDn (distance), Home / End (size)
Distance=1.6
Width=1.6
; Show the mouse cursor on the panel
Cursor=1
; Point a VR controller at the panel to move the cursor (trigger = left click,
; grip = right click, hold to drag)
ControllerPointer=1
; Hide the black bars at the top and bottom during cutscenes
HideLetterbox=1
; Each eye gets its own panel image (needed for 3D models in menus)
PanelPerEye=1
; 3D models in menus (equipment, costumes) get depth. Separation = how strong the depth is,
; Convergence = which distance sits on the panel (smaller = model further back).
; Hotkeys: Ctrl+F5 / Ctrl+F6 (separation), Ctrl+F7 / Ctrl+F8 (convergence) (saved)
MenuModelStereo=1
MenuModelSeparation=0.14
MenuModelConvergence=4.0

; --- Advanced (leave as is) ---
; Head-tracked replacements for the floating world labels (item markers, speech icons)
;BillboardFix=1
;BillboardVS=f006f8946dc6d3c4,6ab95c20c50948e5
; Extra shader lists, filled by the shader hunting keys (developer use)
;WorldVS=
;PanelVS=

[Controllers]
; Show each controller as a small glowing orb
Show=1
; Orb diameter in metres
OrbSize=0.055
; Fade the orb out while the controller is held still, and back in when it moves
FadeWhenStill=1
; Seconds of stillness before fading, and how long the fade takes
StillSeconds=1.5
FadeSeconds=1.0
; How far (metres) the controller must move to count as moving (ignores hand tremble)
MoveMargin=0.015

; --- Controller physics: hair, cloth, ribbons and accessories move out of the way ---
Physics=1
; Extra size on top of the orb's radius, and a shift along the pointing direction (metres).
; Hotkeys: Ctrl+PgUp / Ctrl+PgDn (size), Ctrl+Home / Ctrl+End (shift), Ctrl+Insert shows
; the physics sphere (saved)
PhysicsExtraRadius=0.010
PhysicsOffset=0.0

[Keys]
; Hotkeys: F1..F24, a single letter or digit, or a hex key code like 0x6B.
Recenter=F1
FovDown=F2
FovUp=F3
HeadTracking=F4
LevelHorizon=F5
SwapEyes=F6
SeparationDown=F7
SeparationUp=F8
DualRender=F9
Toggle=F10
Mode=F11
FovLock=F12
HudToggle=0x2D
HudHeadLock=0x2E
HudNearer=0x21
HudFarther=0x22
HudBigger=0x24
HudSmaller=0x23
; Optional extra key for the live world behind menus (Ctrl+F10 always works)
;LiveWorldInMenus=

; [FovPaths] is written by SoraVR itself (where it found the game's field of view).
